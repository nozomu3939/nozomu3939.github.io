<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">営業リスト作成ツールの選び方フロー</title>
  <desc id="desc">必要な情報源、利用方式、企業データベース機能、継続的な複数媒体収集の順で候補を絞る判断フロー</desc>
  <rect width="1200" height="780" rx="36" fill="#f8fafc"/>
  <text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#102a43">価格を見る前に、用途を3問で絞る</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="360" y="112" width="480" height="88" rx="44" fill="#0b7285"/>
    <text x="600" y="166" font-size="25" font-weight="700" fill="#fff">Q1 必要な情報源は1種類か？</text>
    <path d="M600 200v52" stroke="#829ab1" stroke-width="4"/>
    <path d="M320 252h560" stroke="#829ab1" stroke-width="4"/>
    <text x="326" y="240" font-size="18" fill="#486581">はい</text>
    <text x="878" y="240" font-size="18" fill="#486581">いいえ</text>
    <path d="M320 252v45M880 252v45" stroke="#829ab1" stroke-width="4"/>
    <rect x="116" y="297" width="408" height="92" rx="20" fill="#fff" stroke="#9fb3c8" stroke-width="2"/>
    <text x="320" y="335" font-size="23" font-weight="700" fill="#243b53">Q2 地図か、表示ページか？</text>
    <text x="320" y="368" font-size="18" fill="#627d98">対象の取得単位を確認</text>
    <rect x="676" y="297" width="408" height="92" rx="20" fill="#e6fffa" stroke="#2cb1bc" stroke-width="3"/>
    <text x="880" y="335" font-size="23" font-weight="700" fill="#0b5864">Q3 既存DBか、都度収集か？</text>
    <text x="880" y="368" font-size="18" fill="#147d92">更新方法と機能範囲を確認</text>
    <path d="M320 389v74M880 389v74" stroke="#829ab1" stroke-width="4"/>
    <path d="M320 435H185M320 435h135M880 435H745M880 435h135" stroke="#829ab1" stroke-width="4"/>
    <g font-size="18" fill="#486581"><text x="185" y="425">地図</text><text x="455" y="425">ページ</text><text x="745" y="425">既存DB</text><text x="1015" y="425">都度収集</text></g>
    <g>
      <rect x="70" y="463" width="230" height="118" rx="20" fill="#fff" stroke="#57a0d3" stroke-width="2"/>
      <text x="185" y="508" font-size="24" font-weight="700" fill="#243b53">ListupTool</text>
      <text x="185" y="545" font-size="17" fill="#627d98">Googleマップ中心</text>
      <rect x="340" y="463" width="230" height="118" rx="20" fill="#fff" stroke="#9fb3c8" stroke-width="2"/>
      <text x="455" y="508" font-size="24" font-weight="700" fill="#243b53">Lister</text>
      <text x="455" y="545" font-size="17" fill="#627d98">開いたページを抽出</text>
      <rect x="630" y="463" width="230" height="118" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
      <text x="745" y="508" font-size="24" font-weight="700" fill="#7c2d12">Musubu</text>
      <text x="745" y="545" font-size="17" fill="#9a3412">企業DB・ABM</text>
      <rect x="900" y="463" width="230" height="118" rx="20" fill="#e6fffa" stroke="#2cb1bc" stroke-width="3"/>
      <text x="1015" y="508" font-size="24" font-weight="700" fill="#0b5864">Urizo / Lasone Data</text>
      <text x="1015" y="545" font-size="17" fill="#147d92">複数サイトを継続収集</text>
    </g>
    <path d="M600 610v52" stroke="#829ab1" stroke-width="4"/>
    <rect x="286" y="662" width="628" height="76" rx="20" fill="#102a43"/>
    <text x="600" y="695" font-size="22" font-weight="700" fill="#fff">最後は同じ条件の100件で検証</text>
    <text x="600" y="722" font-size="16" fill="#d9e2ec">対象外率・空欄率・重複率・作業時間・総額</text>
  </g>
</svg>
